name: dashscope_image
label: 阿里百炼图片生成
description: 一个可以文生图的工具
params:
  - name: size
    label: 图片尺寸
    type: select
    default: 1024x1024
    required: true
    options:
      - value: 2688*1536
        label: "(16:9)2688*1536"
      - value: 1536*2688
        label: "(9:16)1536*2688"
      - value: 2048*2048
        label: "(1:1)2048*2048"
      - value: 2368*1728
        label: "(4:3)2368*1728"
      - value: 1728*2368
        label: "(3:4)1728*2368"
  - name: style
    label: 图片风格
    type: select
    default: vivid
    required: true
    options:
      - value: vivid
        label: "生动"
      - value: natural
        label: "自然"